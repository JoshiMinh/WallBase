name: Android Release

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v4

    - name: set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Decode Keystore
      env:
        KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      run: |
        test -n "$KEYSTORE_BASE64" && test -n "$KEYSTORE_PASSWORD" && test -n "$KEY_ALIAS" && test -n "$KEY_PASSWORD" || { echo "Release signing secrets are missing" >&2; exit 1; }
        echo "$KEYSTORE_BASE64" | base64 --decode > wallbase-release.jks

    - name: Build Debug and Release APKs
      env:
        KEYSTORE_PATH: wallbase-release.jks
        KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      run: ./gradlew assembleDebug assembleRelease

    - name: Verify release APK signature
      run: |
        "${ANDROID_HOME}/build-tools/36.0.0/apksigner" verify --verbose --print-certs app/build/outputs/apk/release/app-release.apk

    - name: Determine Release Tag
      id: release_info
      run: |
        VERSION=$(grep 'versionName =' app/build.gradle.kts | head -n 1 | awk -F '"' '{print $2}')
        if [ -z "$VERSION" ]; then
          VERSION=$(date +'%m-%Y')
        fi
        echo "version=${VERSION}" >> $GITHUB_OUTPUT
        echo "tag_name=v${VERSION}" >> $GITHUB_OUTPUT
        echo "release_name=Release v${VERSION}" >> $GITHUB_OUTPUT

    - name: Rename APKs with version number
      run: |
        VERSION=${{ steps.release_info.outputs.version }}
        mv app/build/outputs/apk/release/app-release.apk \
           app/build/outputs/apk/release/WallBase-v${VERSION}.apk
        mv app/build/outputs/apk/debug/app-debug.apk \
           app/build/outputs/apk/debug/WallBase-v${VERSION}-debug.apk

    - name: Upload Debug APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: app/build/outputs/apk/debug/WallBase-*.apk

    - name: Upload Release APK
      uses: actions/upload-artifact@v4
      with:
        name: app-release
        path: app/build/outputs/apk/release/WallBase-*.apk

    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ steps.release_info.outputs.tag_name }}
        name: ${{ steps.release_info.outputs.release_name }}
        files: |
          app/build/outputs/apk/release/WallBase-*.apk
        draft: false
        prerelease: false
        previous_tag: v7.2
        body: |
          ## Highlights & Fixes

          - Fixed some errors and improved overall app stability.
          - Standardized codebase architecture into 5 core modules (`core`, `data`, `domain`, `scraper`, `ui`).
          - Refined floating action button placement, multi-wallpaper album stacks, and crop gesture interactions.
          - Updated source repository handling, dialogs, and navigation polish.

        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
