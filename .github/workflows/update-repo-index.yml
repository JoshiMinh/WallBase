name: Update Extensions Catalog Index

on:
  push:
    branches:
      - main
    paths:
      - 'extensions/**.json'
      - '!extensions/repo.json'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-repo-index:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradlew Executable
        run: chmod +x ./gradlew

      - name: Generate Extensions Catalog
        run: ./gradlew generateExtensionRepo

      - name: Commit and Push Updated repo.json
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          if [[ -n $(git status --porcelain extensions/repo.json) ]]; then
            git add extensions/repo.json
            git commit -m "chore(extensions): auto-update community extensions catalog [skip ci]"
            git push
          else
            echo "No changes to extensions/repo.json"
          fi
